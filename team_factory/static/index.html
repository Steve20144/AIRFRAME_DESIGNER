<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Project Factory</title><link rel="stylesheet" href="/assets/style.css"></head>
<body><header><a class="brand" href="/">▦ PROJECT FACTORY <small>AIRFRAME / TEAM OPERATIONS</small></a><div id="system">CONNECTING</div><button id="palette-open" aria-label="Open command palette">⌘ K</button></header>
<main><section class="overview"><div><span class="eyebrow">THE FLOOR IS YOURS</span><h1>Small team.<br>Continuous motion.</h1></div><div id="counts"></div></section>
<div id="notice" role="status"></div><section class="floor" aria-label="Agent factory floor"><div class="floor-grid"></div><div class="floor-label">01 / FACTORY FLOOR</div><div id="stations"></div><div class="conveyor"><div class="belt"></div><button id="package" aria-label="Inspect current task">▣</button><span id="belt-label">WAITING FOR A GOAL</span></div><div class="loading-dock">DISPATCH → HANDOFF → FINISH</div></section>
<section class="command"><form id="goal-form"><label for="goal">What should the team work on?</label><div class="input-row"><input id="goal" placeholder="Give the team a concrete goal…" maxlength="10000" required><select id="first-agent" aria-label="First agent"></select><button class="primary" type="submit">START ↗</button></div><details><summary>Relevant Brain documents (optional, up to 5)</summary><input id="context" placeholder="brain/architecture/overview.md, …" aria-label="Brain document paths"></details></form><div class="team-controls"><button data-mode="paused">Ⅱ Pause team</button><button data-mode="running">▶ Resume</button><button data-mode="stopped">■ Stop run</button><button id="brain-open">▤ Brain</button></div></section>
<div class="columns"><section><div class="section-head"><h2>Goals & packages</h2><span id="queue-count"></span></div><div id="goals"></div><div id="tasks"></div></section><section><div class="section-head"><h2>Activity</h2><span>LIVE / EVENT LOG</span></div><div id="activity" aria-live="polite"></div></section></div></main>
<dialog id="inspector"><button class="close" aria-label="Close inspector">×</button><div id="inspection"></div></dialog><dialog id="palette"><button class="close" aria-label="Close commands">×</button><h2>Factory commands</h2><div id="commands"></div></dialog><div id="toast" role="alert"></div><script src="/assets/app.js"></script></body></html>
